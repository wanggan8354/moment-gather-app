/* ========================================
   拾刻 App Prototype — Brand Design Tokens
   Warm Film / Nostalgic Tone
   ======================================== */

:root {
  /* ── Brand Colors ── */
  --color-primary: #D4845A;
  --color-primary-light: #E8A87C;
  --color-primary-dark: #B86A42;
  --color-primary-bg: #FDF6F0;

  /* ── Warm Neutrals ── */
  --color-bg: #FFFAF5;
  --color-bg-secondary: #FFF5EC;
  --color-bg-tertiary: #F5EDE4;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;

  /* ── Text ── */
  --color-text-primary: #2D1F14;
  --color-text-secondary: #6B5344;
  --color-text-tertiary: #9C8577;
  --color-text-inverse: #FFFFFF;

  /* ── Borders & Dividers ── */
  --color-border: #E8DDD2;
  --color-border-light: #F0E8DF;

  /* ── Accent / Film Tones ── */
  --color-film-gold: #C9A96E;
  --color-film-rose: #D4847A;
  --color-film-sage: #8BA888;
  --color-film-sky: #7BA7BC;

  /* ── State Colors ── */
  --state-success: #6BAF7B;
  --state-warning: #D4A04A;
  --state-error: #C96B5A;
  --state-info: #6B8FC9;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* ── Shadows (static alpha ≤ 0.05) ── */
  --shadow-sm: 0 1px 3px rgba(45, 31, 20, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 31, 20, 0.05);
  --shadow-lg: 0 8px 24px rgba(45, 31, 20, 0.05);
  --shadow-float: 0 12px 40px rgba(45, 31, 20, 0.08);

  /* ── Typography ── */
  --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* ── Spacing Scale ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* ── Film Grain Overlay ── */
  --grain-opacity: 0.03;
}

/* ── Typography Classes ── */
.display-xl {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--color-text-primary);
}

.display-lg {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--color-text-primary);
}

.display-md {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--color-text-primary);
}

.heading-lg {
  font-family: var(--font-body);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.4;
  color: var(--color-text-primary);
}

.heading-md {
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--color-text-primary);
}

.heading-sm {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.5;
  color: var(--color-text-primary);
}

.body-lg {
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.body-md {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.body-sm {
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--color-text-tertiary);
}

.caption {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--color-text-tertiary);
  letter-spacing: 0.02em;
}

.label {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--color-text-secondary);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

    <style>
    /* ── Base ── */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFAF5;
      color: #2D1F14;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Mobile Container ── */
    .mobile-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background-color: #FFFAF5;
      overflow-x: hidden;
    }

    /* ── Film Grain Overlay ── */
    .mobile-container::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 128px 128px;
    }

    /* ── Avatar Gradient Border ── */
    .avatar-ring {
      background: linear-gradient(135deg, #C9A96E, #D4845A, #D4847A, #C9A96E);
      padding: 3px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-ring img {
      border-radius: 9999px;
      border: 3px solid #FFFAF5;
    }

    /* ── PRO Badge ── */
    .pro-badge {
      background: linear-gradient(135deg, #C9A96E, #D4A04A);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* ── Stats Row ── */
    .stat-item {
      text-align: center;
      flex: 1;
      position: relative;
    }
    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, transparent, #E8DDD2, transparent);
    }

    /* ── Video Card ── */
    .video-card {
      flex-shrink: 0;
      width: 140px;
      border-radius: 12px;
      overflow: hidden;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(45, 31, 20, 0.06);
      transition: transform 0.2s ease;
    }
    .video-card:active {
      transform: scale(0.97);
    }
    .video-card .thumb {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
      position: relative;
    }
    .video-card .duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(45, 31, 20, 0.7);
      backdrop-filter: blur(4px);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    /* ── Menu Card ── */
    .menu-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(45, 31, 20, 0.04);
      overflow: hidden;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      position: relative;
    }
    .menu-item:active {
      background-color: #FFF5EC;
    }
    .menu-item:not(:last-child)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 52px;
      right: 16px;
      height: 1px;
      background: #F0E8DF;
    }

    /* ── Storage Progress ── */
    .storage-bar {
      height: 6px;
      background: #F5EDE4;
      border-radius: 9999px;
      overflow: hidden;
      flex: 1;
    }
    .storage-bar .fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #D4845A, #C9A96E);
      width: 32%;
    }

    /* ── Bottom Tab Bar ── */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      background: rgba(255, 250, 245, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #F0E8DF;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 6px 0 28px 0;
      z-index: 100;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 12px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .tab-item .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-item .tab-label {
      font-size: 10px;
      font-weight: 500;
      color: #9C8577;
    }
    .tab-item.active .tab-label {
      color: #D4845A;
      font-weight: 600;
    }
    .tab-create {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D4845A, #E8A87C);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(212, 132, 90, 0.35);
      margin-top: -16px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .tab-create:active {
      transform: scale(0.93);
    }

    /* ── Horizontal Scroll ── */
    .scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 8px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-row::-webkit-scrollbar {
      display: none;
    }
    .scroll-row > * {
      scroll-snap-align: start;
    }

    /* ── Section Title ── */
    .section-title {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #2D1F14;
      letter-spacing: -0.01em;
    }

    /* ── Film Credits Style ── */
    .film-credit {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #9C8577;
      font-size: 12px;
    }

    /* ── Warm Glow Background ── */
    .warm-glow {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 200px;
      background: radial-gradient(ellipse, rgba(212, 132, 90, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</body>
</html>
