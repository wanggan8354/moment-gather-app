    <style id="theme-vars">
/* ========================================
   拾刻 App Prototype — Brand Design Tokens
   Warm Film / Nostalgic Tone
   ======================================== */

:root {
  /* ── Brand Colors ── */
  --color-primary: #D4845A;
  --color-primary-light: #E8A87C;
  --color-primary-dark: #B86A42;
  --color-primary-bg: #FDF6F0;

  /* ── Warm Neutrals ── */
  --color-bg: #FFFAF5;
  --color-bg-secondary: #FFF5EC;
  --color-bg-tertiary: #F5EDE4;
  --color-surface: #FFFFFF;
  --color-surface-elevated: #FFFFFF;

  /* ── Text ── */
  --color-text-primary: #2D1F14;
  --color-text-secondary: #6B5344;
  --color-text-tertiary: #9C8577;
  --color-text-inverse: #FFFFFF;

  /* ── Borders & Dividers ── */
  --color-border: #E8DDD2;
  --color-border-light: #F0E8DF;

  /* ── Accent / Film Tones ── */
  --color-film-gold: #C9A96E;
  --color-film-rose: #D4847A;
  --color-film-sage: #8BA888;
  --color-film-sky: #7BA7BC;

  /* ── State Colors ── */
  --state-success: #6BAF7B;
  --state-warning: #D4A04A;
  --state-error: #C96B5A;
  --state-info: #6B8FC9;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* ── Shadows (static alpha <= 0.05) ── */
  --shadow-sm: 0 1px 3px rgba(45, 31, 20, 0.04);
  --shadow-md: 0 2px 8px rgba(45, 31, 20, 0.05);
  --shadow-lg: 0 8px 24px rgba(45, 31, 20, 0.05);
  --shadow-float: 0 12px 40px rgba(45, 31, 20, 0.08);

  /* ── Typography ── */
  --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* ── Spacing Scale ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;

  /* ── Film Grain Overlay ── */
  --grain-opacity: 0.03;
}

/* ── Typography Classes ── */
.display-xl {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  color: var(--color-text-primary);
}

.display-lg {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--color-text-primary);
}

.display-md {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--color-text-primary);
}

.heading-lg {
  font-family: var(--font-body);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1.4;
  color: var(--color-text-primary);
}

.heading-md {
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--color-text-primary);
}

.heading-sm {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.5;
  color: var(--color-text-primary);
}

.body-lg {
  font-family: var(--font-body);
  font-size: 1.125rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.body-md {
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.body-sm {
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--color-text-tertiary);
}

.caption {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--color-text-tertiary);
  letter-spacing: 0.02em;
}

.label {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--color-text-secondary);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* ── Mobile Shell ── */
      .mobile-shell {
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--color-bg);
        position: relative;
        overflow-x: hidden;
      }

      /* ── Film Strip Decorative Border ── */
      .film-strip-top {
        position: relative;
      }
      .film-strip-top::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: repeating-linear-gradient(
          90deg,
          var(--color-film-gold) 0px,
          var(--color-film-gold) 12px,
          transparent 12px,
          transparent 16px,
          var(--color-film-gold) 16px,
          var(--color-film-gold) 28px,
          transparent 28px,
          transparent 32px
        );
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        opacity: 0.7;
      }

      /* ── Film Strip Vertical Borders ── */
      .film-strip-frame {
        position: relative;
        border: 2px solid var(--color-film-gold);
        border-radius: var(--radius-lg);
        opacity: 0.6;
      }
      .film-strip-frame::before,
      .film-strip-frame::after {
        content: '';
        position: absolute;
        top: 6px;
        bottom: 6px;
        width: 4px;
        background: repeating-linear-gradient(
          180deg,
          var(--color-film-gold) 0px,
          var(--color-film-gold) 6px,
          transparent 6px,
          transparent 10px
        );
        opacity: 0.5;
      }
      .film-strip-frame::before { left: -6px; }
      .film-strip-frame::after { right: -6px; }

      /* ── Hero Banner Gradient ── */
      .hero-gradient {
        background: linear-gradient(135deg, #D4845A 0%, #E8A87C 40%, #C9A96E 100%);
      }

      /* ── Video Card Hover ── */
      .video-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .video-card:active {
        transform: scale(0.97);
      }

      /* ── Play Button Overlay ── */
      .play-overlay {
        background: rgba(45, 31, 20, 0.35);
        backdrop-filter: blur(2px);
        transition: background 0.2s ease;
      }
      .video-card:hover .play-overlay {
        background: rgba(45, 31, 20, 0.5);
      }

      /* ── Duration Badge ── */
      .duration-badge {
        background: rgba(45, 31, 20, 0.7);
        backdrop-filter: blur(4px);
      }

      /* ── Template Card ── */
      .template-card {
        transition: transform 0.2s ease;
      }
      .template-card:active {
        transform: scale(0.96);
      }

      /* ── Bottom Tab Bar ── */
      .tab-bar {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--color-border-light);
      }
      .tab-item {
        transition: color 0.15s ease;
      }
      .tab-item.active {
        color: var(--color-primary);
      }
      .tab-item:not(.active) {
        color: var(--color-text-tertiary);
      }

      /* ── Create Button ── */
      .create-btn {
        background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
        box-shadow: 0 4px 16px rgba(212, 132, 90, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .create-btn:active {
        transform: scale(0.92);
        box-shadow: 0 2px 8px rgba(212, 132, 90, 0.25);
      }

      /* ── Notification Dot ── */
      .notification-dot {
        width: 8px;
        height: 8px;
        background: var(--color-film-rose);
        border-radius: 50%;
        border: 2px solid var(--color-bg);
        position: absolute;
        top: 0;
        right: 0;
      }

      /* ── Scroll Hint ── */
      .scroll-hint {
        background: linear-gradient(90deg, transparent 0%, var(--color-bg) 100%);
        pointer-events: none;
      }

      /* ── Film Grain Overlay ── */
      .grain-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: var(--grain-opacity);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      /* ── Warm Glow on Avatar ── */
      .avatar-glow {
        box-shadow: 0 0 0 3px var(--color-primary-bg), 0 0 0 5px var(--color-primary-light);
      }

      /* ── Section Title ── */
      .section-title {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 1.125rem;
        color: var(--color-text-primary);
        letter-spacing: -0.01em;
      }
      .section-subtitle {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 0.8125rem;
        color: var(--color-text-tertiary);
      }
    </style>
</head>
